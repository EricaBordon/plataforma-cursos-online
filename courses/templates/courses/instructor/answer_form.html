{% extends "base.html" %}

{% block title %}Opción de respuesta{% endblock %}

{% block content %}

<div class="container py-5">

    <h1 class="mb-4">

        {% if answer %}
            Editar opción
        {% else %}
            Crear opción
        {% endif %}

    </h1>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Guardar opción
                </button>

                <a href="{% url 'instructor-dashboard' %}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}
