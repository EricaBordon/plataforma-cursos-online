{% extends "base.html" %}

{% block title %}Eliminar curso{% endblock %}

{% block content %}

<section class="container py-5">

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <h1 class="fw-bold text-danger">
                Eliminar curso
            </h1>

            <p class="mt-3">
                ¿Estás segura de que querés eliminar el curso
                <strong>{{ course.title }}</strong>?
            </p>

            <p class="text-muted">
                Esta acción también puede eliminar sus módulos y lecciones asociados.
            </p>

            <form method="post">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Sí, eliminar
                </button>

                <a href="{% url 'instructor-dashboard' %}"
                   class="btn btn-secondary">
                    Cancelar
                </a>
            </form>

        </div>
    </div>

</section>

{% endblock %}
