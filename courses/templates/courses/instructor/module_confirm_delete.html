{% extends "base.html" %}

{% block title %}Eliminar módulo{% endblock %}

{% block content %}

<section class="container py-5">

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <h1 class="fw-bold text-danger">
                Eliminar módulo
            </h1>

            <p class="mt-3">
                ¿Estás segura de que querés eliminar el módulo
                <strong>{{ module.title }}</strong>?
            </p>

            <p class="text-muted">
                También se eliminarán sus lecciones.
            </p>

            <form method="post">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Sí, eliminar
                </button>

                <a href="{% url 'instructor-dashboard' %}"
                   class="btn btn-secondary">
                    Cancelar
                </a>
            </form>

        </div>
    </div>

</section>

{% endblock %}
