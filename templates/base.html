<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EduPlatform{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Northdemy</a>

        <div class="ms-auto">
            <a class="btn btn-outline-light me-2" href="/">Cursos</a>

            {% if user.is_authenticated %}
                <a class="btn btn-outline-light me-2" href="{% url 'student-dashboard' %}">
                     Mi aprendizaje
                </a>
                <a href="{% url 'payment-history' %}" class="btn btn-outline-light"> Mis pagos</a>
                <a class="btn btn-primary me-2" href="/admin/">Panel</a>
                <a class="btn btn-outline-warning" href="{% url 'logout' %}">Cerrar sesión</a>
            {% else %}
                <a class="btn btn-primary" href="{% url 'login' %}">Iniciar sesión</a>
            {% endif %}
        </div>
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="bg-dark text-white text-center py-4 mt-5">
    <p class="mb-0">Plataforma de Cursos Online · Django + PostgreSQL</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
